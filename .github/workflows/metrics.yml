name: Main Metrics

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - master
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    environment:
      name: production

    permissions:
      contents: write

    steps:
      - uses: Lakshay-M07/metrics@master
        with:
          ##########################################
          # Output
          ##########################################

          filename: github-metrics.svg

          output_action: commit
          committer_branch: metrics-renders
          committer_message: "chore: update main metrics"

          ##########################################
          # Authentication
          ##########################################

          token: ${{ secrets.METRICS_TOKEN }}

          ##########################################
          # General Configuration
          ##########################################

          config_theme: github_dark
          config_timezone: Asia/Kolkata

          ##########################################
          # Main Card
          ##########################################

          base: header
